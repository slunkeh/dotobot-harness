name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      HARNESS_HOME: /tmp/dotobot-ci-home
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check harness agent providers connectors isolation channels deploy tests
      - name: Test
        run: python -m pytest
      - name: CLI smoke check
        run: python -m harness --help
      - name: The whole runtime imports on a bare interpreter
        run: |
          python -S - <<'EOF'
          import sys
          before = set(sys.modules)
          import agent.govern, agent.policy, agent.runtime, agent.tools
          import channels.base, channels.desktop, channels.viewmodel
          import connectors.github, connectors.gmail, connectors.linear, connectors.mcp, connectors.registry
          import harness.rooms, harness.routines, harness.server, harness.workflows, harness.ws
          import isolation.container, isolation.machines, isolation.vm
          import providers.anthropic, providers.grok, providers.openai
          local = {"agent", "channels", "connectors", "harness", "isolation", "providers"}
          third = sorted(
              name
              for name in {m.split(".")[0] for m in set(sys.modules) - before}
              if name not in sys.stdlib_module_names
              and name not in local
              and not name.startswith("_")
          )
          if third:
              sys.exit(f"third-party imports in the runtime: {third}")
          print("runtime is stdlib-only across", len(local), "packages")
          EOF

      - name: Installer syntax
        if: matrix.python-version == '3.12'
        run: |
          bash -n install.sh
          shellcheck -s bash install.sh
          bash install.sh --help
